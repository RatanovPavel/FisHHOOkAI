<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKULLA.RU | WebSocket Чат</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #020617; 
            color: #f8fafc; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            height: 100vh;
            overflow: hidden;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        .chat-header {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(34, 211, 238, 0.1);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(34, 211, 238, 0.3);
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .messages-area::-webkit-scrollbar { width: 4px; }
        .messages-area::-webkit-scrollbar-track { background: transparent; }
        .messages-area::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.3);
            border-radius: 2px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 14px;
            line-height: 1.5;
            animation: messageIn 0.3s ease-out;
            word-wrap: break-word;
        }

        @keyframes messageIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-user {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.2), rgba(168, 85, 247, 0.2));
            border: 1px solid rgba(34, 211, 238, 0.3);
            border-bottom-right-radius: 4px;
            color: #e2e8f0;
        }

        .message-bot {
            align-self: flex-start;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(100, 116, 139, 0.2);
            border-bottom-left-radius: 4px;
            color: #cbd5e1;
        }

        .message-image {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 8px;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            align-self: flex-start;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(34, 211, 238, 0.5);
            animation: typingBounce 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-8px); opacity: 1; }
        }

        .input-panel {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(34, 211, 238, 0.1);
            padding: 16px 20px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .message-input {
            flex: 1;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(100, 116, 139, 0.3);
            border-radius: 24px;
            padding: 12px 20px;
            color: #e2e8f0;
            font-size: 14px;
            resize: none;
            max-height: 120px;
            outline: none;
            transition: border-color 0.3s;
        }

        .message-input:focus {
            border-color: rgba(34, 211, 238, 0.5);
        }

        .send-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #22d3ee, #a855f7);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .send-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.4);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .mic-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(100, 116, 139, 0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
            color: #94a3b8;
            font-size: 20px;
        }

        .mic-btn:hover {
            border-color: rgba(34, 211, 238, 0.5);
            color: #22d3ee;
        }

        .mic-btn.recording {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.5);
            color: #f87171;
            animation: pulseRecord 1.5s infinite;
        }

        @keyframes pulseRecord {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
        }

        .settings-panel {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(34, 211, 238, 0.1);
            padding: 10px 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            overflow-x: auto;
        }

        .setting-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .setting-label {
            font-size: 9px;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 0.1em;
        }

        .setting-select {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(100, 116, 139, 0.3);
            border-radius: 8px;
            padding: 6px 10px;
            color: #e2e8f0;
            font-size: 11px;
            outline: none;
            cursor: pointer;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 700;
        }

        .status-connected {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .status-disconnected {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .status-connecting {
            background: rgba(234, 179, 8, 0.2);
            color: #fbbf24;
            border: 1px solid rgba(234, 179, 8, 0.3);
        }
    </style>
</head>

<script>
// ============================================================================
// 💬 WEBSOCKET ЧАТ С ВИРТУАЛЬНЫМ СОБЕСЕДНИКОМ
// ============================================================================

let characterKey = '';
let characterData = null;
let isRecording = false;
let mediaRecorder = null;
let audioChunks = [];
let isWaitingResponse = false;
let ws = null;
let wsReconnectTimer = null;

const urlParams = new URLSearchParams(window.location.search);
characterKey = urlParams.get('character') || 'anna';

// Проверяем авторизацию из localStorage
const skullaUser = JSON.parse(localStorage.getItem('skulla_user') || 'null');
if (!skullaUser || !skullaUser.isLoggedIn || !skullaUser.email) {
    window.location.href = '/';
    throw new Error('Требуется авторизация');
}

// Берём уникальный ID авторизованного пользователя
const USER_ID = String(skullaUser.id || skullaUser.email);
document.getElementById('displayUserId').textContent = USER_ID;

function copyWorkerUserId() {
    navigator.clipboard.writeText(USER_ID);
    
    alert(`Скопирован ваш USER_ID: ${USER_ID}\nВставьте его в переменную USER_ID в Colab/Kaggle.`);
}

function getWorkerCode(platform = 'colab') {
    const hints = {
        colab: '# 1. Включите GPU: Среда выполнения -> Сменить среду выполнения -> T4 GPU -> Сохранить\n# 2. Нажмите кнопку запуска (▶) слева от ячейки',
        kaggle: '# 1. Включите GPU: Справа Settings -> Accelerator -> GPU T4 x2 (или P100)\n# 2. Нажмите кнопку запуска (▶) слева от ячейки',
        hf: '# 1. Включите GPU: Settings -> Space hardware -> Nvidia T4 small\n# 2. Запустите ячейку (▶)'
    };
    const gpuCheck = `import torch\nif not torch.cuda.is_available():\n    raise RuntimeError("❌ GPU не включён!\\n${(hints[platform] || hints.colab).replace(/# /g, '').replace(/\n/g, '\\n')}")\nprint("✅ GPU готов:", torch.cuda.get_device_name(0))`;
    return `${hints[platform] || hints.colab}\n\n${gpuCheck}\nimport os, sys, shutil, subprocess, importlib\nrepo_dir = os.path.abspath('FisHHOOkAI')\nif os.getcwd() == repo_dir:\n    os.chdir('..')\nshutil.rmtree(repo_dir, ignore_errors=True)\nsubprocess.run(['git', 'clone', '-q', 'https://github.com/RatanovPavel/FisHHOOkAI', repo_dir], check=True)\nos.chdir(repo_dir)\nif repo_dir not in sys.path:\n    sys.path.insert(0, repo_dir)\nimport main\nimportlib.reload(main)\nmain.USER_ID = "${USER_ID}"\nawait main.worker_loop()`;
}




function copyUserIdOnly() {
    navigator.clipboard.writeText(USER_ID);
    alert(`Скопирован ID: ${USER_ID}\nВставьте его в поле USER_ID в Colab и нажмите ▶`);
}

function copyFullCode(platform = 'colab') {
    navigator.clipboard.writeText(getWorkerCode(platform));
    alert(`Готовый код для ${platform.toUpperCase()} с инструкцией и вашим ID скопирован!\nВставьте его в ячейку (Ctrl+V) и запустите.`);
}


function showWorkerSetupCard() {
    if (document.getElementById('workerSetupCard')) return;

    const area = document.getElementById('messagesArea');
    const card = document.createElement('div');
    card.id = 'workerSetupCard';
    card.className = 'message message-bot w-full max-w-[90%] border border-cyan-500/30 bg-slate-900/90';

    const colabUrl = 'https://colab.research.google.com/#create=true';
    const kaggleUrl = 'https://www.kaggle.com/code';
    const hfUrl = 'https://huggingface.co/spaces';

    card.innerHTML = `
        <div class="font-bold text-cyan-400 text-sm mb-1.5">⚡ Воркер ещё не подключён</div>
        <p class="text-xs text-slate-300 mb-3">Выберите платформу с бесплатным GPU для запуска собеседника:</p>
        
        <div class="flex flex-col gap-2 mb-3">
            <a href="${colabUrl}" target="_blank" onclick="copyFullCode('colab')" class="block text-center py-2 px-3 rounded-lg bg-amber-500/20 border border-amber-500/40 hover:bg-amber-500/30 text-amber-300 font-bold text-xs">
                1. Google Colab (создать ноутбук + копировать код) 🚀
            </a>
            <a href="${kaggleUrl}" target="_blank" onclick="copyFullCode('kaggle')" class="block text-center py-2 px-3 rounded-lg bg-sky-500/20 border border-sky-500/40 hover:bg-sky-500/30 text-sky-300 font-bold text-xs">
                2. Kaggle Notebooks (включить GPU T4 + копировать код) 📊
            </a>
            <a href="${hfUrl}" target="_blank" onclick="copyFullCode('hf')" class="block text-center py-2 px-3 rounded-lg bg-yellow-500/20 border border-yellow-500/40 hover:bg-yellow-500/30 text-yellow-300 font-bold text-xs">
                3. Hugging Face Spaces (GPU / Docker + копировать код) 🤗
            </a>
        </div>
    `;

    area.appendChild(card);
    scrollToBottom();
}


const SERVER_WS_URL = 'wss://skulla.ru';
//const SERVER_WS_URL = 'ws://localhost';


// ============================================================================
// 📡 WEBSOCKET ПОДКЛЮЧЕНИЕ
// ============================================================================

function connectWebSocket() {
    const wsUrl = `${SERVER_WS_URL}/ws/browser/${USER_ID}`;
    
    console.log(`🔌 Подключение к ${wsUrl}...`);
    updateConnectionStatus('connecting');
    
    ws = new WebSocket(wsUrl);
    
    ws.onopen = () => {
        console.log('✅ WebSocket подключён');
        updateConnectionStatus('connected');
        
        // Проверяем статус воркера
        ws.send(JSON.stringify({
            type: 'check_worker'
        }));
    };
    
    ws.onmessage = (event) => {
        try {
            const data = JSON.parse(event.data);
            handleWebSocketMessage(data);
        } catch (e) {
            console.error('❌ Ошибка парсинга сообщения:', e);
        }
    };
    
    ws.onclose = (event) => {
        console.log(`🔌 WebSocket закрыт: ${event.code} ${event.reason}`);
        updateConnectionStatus('disconnected');
        
        // Переподключение через 3 секунды
        if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
        wsReconnectTimer = setTimeout(connectWebSocket, 3000);
    };
    
    ws.onerror = (error) => {
        console.error('❌ WebSocket ошибка:', error);
        updateConnectionStatus('disconnected');
    };
}

function handleWebSocketMessage(data) {
    console.log('📨 Получено сообщение:', data.type);
    
    switch (data.type) {
        case 'welcome':
            console.log(`👋 Приветствие: ${data.message}`);
            if (!data.worker_connected) {
                showWorkerSetupCard();
            }
            break;
        
        case 'worker_status':
            if (data.connected) {
                const card = document.getElementById('workerSetupCard');
                if (card) card.remove();
                console.log('✅ Воркер подключён');
            } else {
                console.log('❌ Воркер не подключён');
                showWorkerSetupCard();
            }
            break;
        
        case 'task_accepted':
            console.log(`✅ Задача принята: ${data.task_id}`);
            break;
        
        case 'task_status':
            handleTaskStatus(data);
            break;
        
        case 'task_result':
            handleTaskResult(data);
            break;
        
        case 'error':
            console.error('❌ Ошибка от сервера:', data.message);
            hideTypingIndicator();
            addBotMessage(`❌ Ошибка: ${data.message}`);
            isWaitingResponse = false;
            document.getElementById('sendBtn').disabled = false;
            break;
        
        default:
            console.log('⚠️ Неизвестный тип:', data.type);
    }
}

function handleTaskStatus(data) {
    const statusMessages = {
        'processing': '🤔 Думаю...',
        'thinking': '🧠 Генерирую ответ...',
        'speaking': '🎤 Синтезирую речь...',
        'generating': '🎨 Генерирую изображение...',
        'uploading': '📤 Отправляю результаты...'
    };
    
    const message = statusMessages[data.status] || data.message || 'Обработка...';
    
    // Обновляем индикатор статуса
    const statusEl = document.getElementById('taskStatus');
    if (statusEl) {
        statusEl.textContent = message;
    } else {
        showTypingIndicator(message);
    }
}

function handleTaskResult(data) {
    hideTypingIndicator();
    isWaitingResponse = false;
    document.getElementById('sendBtn').disabled = false;
    
    console.log('📦 Результат получен');
    
    // Показываем ответ бота
    addBotMessage(
        data.bot_text || '...',
        data.audio_url,
        data.image_url
    );

    loadMemoryBadge();
    if (data.next_node && scenarioNodes[data.next_node]) currentNode = scenarioNodes[data.next_node];
    if (currentNode) renderQuestChoices(); else if (data.suggestions?.length) renderSuggestions(data.suggestions);

    // Автовоспроизведение аудио
    if (data.audio_url) {
        const audio = new Audio(data.audio_url);
        audio.play().catch(e => console.log('Автовоспроизведение заблокировано'));
    }
}

function updateConnectionStatus(status) {
    const statusEl = document.getElementById('wsStatus');
    
    statusEl.className = 'status-indicator';
    
    switch (status) {
        case 'connected':
            statusEl.classList.add('status-connected');
            statusEl.innerHTML = '<div class="w-2 h-2 rounded-full bg-green-500"></div><span>Подключено</span>';
            break;
        case 'connecting':
            statusEl.classList.add('status-connecting');
            statusEl.innerHTML = '<div class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></div><span>Подключение...</span>';
            break;
        case 'disconnected':
            statusEl.classList.add('status-disconnected');
            statusEl.innerHTML = '<div class="w-2 h-2 rounded-full bg-red-500"></div><span>Отключено</span>';
            break;
    }
}

// ============================================================================
// 💬 ЧАТ ФУНКЦИИ
// ============================================================================

// Загрузка данных персонажа
async function loadCharacter() {
    try {
        const resp = await fetch(`/api/studio/fishhook/character/${characterKey}/preview`);
        const data = await resp.json();
        
        if (data.status === 'success') {
            characterData = data.preview;
            
            document.getElementById('chatName').textContent = characterData.name;
            document.getElementById('charAge').textContent = `${characterData.age} лет`;
            
            const avatar = characterData.main_photo || `/characters/${characterKey}/main.jpg`;
            document.getElementById('chatAvatar').src = avatar;
            
            addBotMessage(`Привет! Я ${characterData.name}. ${characterData.description || 'Рада знакомству!'}`);
            
            document.title = `SKULLA.RU | Чат с ${characterData.name}`;
            loadMemoryBadge();
        }
    } catch (e) {
        console.error('Ошибка загрузки персонажа:', e);
        addBotMessage('Ошибка загрузки собеседника. Попробуйте обновить страницу.');
    }
}

function applyAccountAndStats(d) {
    const s = d.memory?.state || {}, a = d.account || {};
    isPremiumUser = !!a.is_premium; renderScenarios();
    document.getElementById('statMood').textContent = `😊 Настроение: ${s.mood ?? 50}%`;
    document.getElementById('statTrust').textContent = `💖 Доверие: ${s.trust ?? 30}%`;
    document.getElementById('statIntimacy').textContent = `🔥 Близость: ${s.intimacy ?? 20}%`;
    document.getElementById('statEnergy').textContent = `⚡ Энергия: ${s.energy ?? 80}%`;
    document.getElementById('userBalanceBadge').textContent = `💀 ${a.skulls ?? 0}`;
    const btn = document.getElementById('premiumBadgeBtn');
    btn.textContent = a.is_premium ? `👑 PREMIUM до ${a.premium_until.slice(0, 10)}` : '👑 Premium (20 💀/мес)';
}
function renderSuggestions(list = ["👋 Привет! Давай познакомимся", "📸 Пришли свою фоточку", "🎤 Ответь мне голосом"]) {
    const bar = document.getElementById('suggestionsBar');
    if (bar) bar.innerHTML = list.map(t => `<button type="button" onclick="useSuggestion('${t.replace(/'/g, "\\'")}')" class="px-2.5 py-1 rounded-full bg-cyan-500/10 hover:bg-cyan-500/20 border border-cyan-500/30 text-cyan-300 text-[11px] whitespace-nowrap cursor-pointer">${escapeHtml(t)}</button>`).join('');
}
function useSuggestion(text) { document.getElementById('messageInput').value = text; sendMessage(); }
renderSuggestions();

let allScenarios = [], scenarioNodes = {}, currentNode = null, activeScenario = null, isPremiumUser = false;
async function loadScenarios() {
    const r = await fetch('/api/memory/scenarios');
    if (r.ok) {
        allScenarios = (await r.json()).scenarios || [];
        scenarioNodes = Object.assign({}, ...allScenarios.map(s => s.nodes || {}));
        renderScenarios();
    }
}

function renderScenarios() {
    const bar = document.getElementById('scenariosBar');
    if (!bar) return;
    let pool = [0, 1, 2].map(i => allScenarios[(scenarioOffset + i) % allScenarios.length]).filter(Boolean);
    if (activeScenario && !pool.some(x => x.entry === activeScenario.entry)) pool[0] = activeScenario;
    const moreBtn = allScenarios.length > 3 ? `<button type="button" onclick="nextScenarios()" class="ml-auto px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 text-xs cursor-pointer">🔄 Ещё</button>` : '';
    const cls = sc => activeScenario?.entry === sc.entry ? 'bg-amber-500/35 border-amber-400 text-white' : 'bg-amber-500/10 hover:bg-amber-500/20 border-amber-500/30 text-amber-200';
    bar.innerHTML = pool.map(sc => `<button type="button" onclick="startScenario('${sc.entry}')" class="px-2.5 py-1 rounded-lg border text-xs cursor-pointer ${cls(sc)}">${isPremiumUser ? '' : '🔒 '}${sc.icon} ${escapeHtml(sc.title)}</button>`).join('') + moreBtn;
}
let scenarioOffset = 0;
function nextScenarios() { scenarioOffset = (scenarioOffset + 1) % allScenarios.length; renderScenarios(); }

function startScenario(entryKey) {
    if (!isPremiumUser) return alert('🎭 Ролевые сценарии доступны с подпиской 👑 PREMIUM (кнопка в правом верхнем углу чата).');
    activeScenario = allScenarios.find(x => x.entry === entryKey) || null; currentNode = scenarioNodes[entryKey] || null; renderScenarios();
    if (currentNode?.choices?.length) renderSuggestions(currentNode.choices);
    if (activeScenario && ws && ws.readyState === WebSocket.OPEN) { document.getElementById('messageInput').value = `🎭 Начинаем сценарий: ${activeScenario.title}`; sendMessage(true); }
}

loadScenarios();

async function loadMemoryBadge() {
    const r = await fetch(`/api/memory/${encodeURIComponent(USER_ID)}/${characterKey}`);
    if (r.ok) applyAccountAndStats(await r.json());
}
async function showMemoryDebug() {
    const r = await fetch(`/api/memory/${encodeURIComponent(USER_ID)}/${characterKey}`);
    if (!r.ok) return addBotMessage('❌ Ошибка чтения памяти');
    const d = await r.json(), m = d.memory || {}, a = d.account || {};
    const facts = (m.facts || []).join('; ') || 'нет';
    const gifts = (m.gifts || []).map(g => `${g.name} (${g.date})`).join(', ') || 'нет';
    addBotMessage(`🧠 ПАМЯТЬ (${characterKey}):\n• Имя: ${m.user_name || 'не задано'}\n• Факты: ${facts}\n• Подарки: ${gifts}\n• Статы: ${JSON.stringify(m.state || {})}\n• Аккаунт: 💀 ${a.skulls ?? 0}, Premium=${a.is_premium}\n• Сообщений в истории: ${(m.history || []).length}`);
}

async function sendGift(name, cost, currency, mood, trust, intimacy) {
    if (!ws || ws.readyState !== WebSocket.OPEN || document.getElementById('workerSetupCard')) {
        return alert('⚡ Сначала подключите воркер (GPU), чтобы собеседник мог принять ваш подарок!');
    }
    const r = await fetch(`/api/memory/${encodeURIComponent(USER_ID)}/${characterKey}/gift`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, cost, currency, mood, trust, intimacy }) });
    if (!r.ok) { const err = await r.json().catch(() => ({})); return alert(err.detail === 'NOT_ENOUGH_SKULLS' ? 'Недостаточно 💀 черепов!' : err.detail === 'NOT_ENOUGH_BONES' ? 'Недостаточно 🦴 костей!' : 'Ошибка отправки подарка'); }
    applyAccountAndStats(await r.json());
    document.getElementById('messageInput').value = `🎁 Подарил тебе: ${name}`;
    sendMessage();
}
async function buyPremium() {
    if (!confirm('Оформить 👑 PREMIUM на 30 дней за 20 💀? Откроет интимные темы и 18+ фото.')) return;
    const r = await fetch(`/api/memory/${encodeURIComponent(USER_ID)}/buy_premium`, { method: 'POST' });
    if (!r.ok) return alert('Недостаточно 💀 skulls на балансе! Пополните баланс в магазине.');
    const d = await r.json();
    applyAccountAndStats({ account: d.account });
    alert('👑 PREMIUM успешно активирован на 30 дней!');
}

function addUserMessage(text, imageUrl = null) {
    const area = document.getElementById('messagesArea');
    const msg = document.createElement('div');
    msg.className = 'message message-user';
    
    let content = `<div>${escapeHtml(text)}</div>`;
    if (imageUrl) {
        content += `<img src="${imageUrl}" class="message-image" alt="Ваше изображение">`;
    }
    
    msg.innerHTML = content;
    area.appendChild(msg);
    scrollToBottom();
}

function addBotMessage(text, audioUrl = null, imageUrl = null) {
    const area = document.getElementById('messagesArea');
    const msg = document.createElement('div');
    msg.className = 'message message-bot';
    
    let content = `<div>${escapeHtml(text)}</div>`;
    if (imageUrl) {
        content += `<img src="${imageUrl}" class="message-image" alt="Изображение">`;
    }
    if (audioUrl) {
        // Проверяем, является ли URL data URL (base64) или обычным URL
        if (audioUrl.startsWith('data:')) {
            content += `<audio controls src="${audioUrl}" class="mt-2 w-full" style="max-width: 300px;"></audio>`;
        } else {
            content += `<audio controls src="${audioUrl}" class="mt-2 w-full" style="max-width: 300px;"></audio>`;
        }
    }
    
    msg.innerHTML = content;
    area.appendChild(msg);
    scrollToBottom();
}

function showTypingIndicator(customText = null) {
    const area = document.getElementById('messagesArea');
    
    // Удаляем старый индикатор если есть
    hideTypingIndicator();
    
    const indicator = document.createElement('div');
    indicator.className = 'typing-indicator';
    indicator.id = 'typingIndicator';
    
    if (customText) {
        indicator.innerHTML = `<div class="text-slate-400 text-sm">${customText}</div>`;
    } else {
        indicator.innerHTML = `
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
        `;
    }
    
    area.appendChild(indicator);
    scrollToBottom();
}

function hideTypingIndicator() {
    const indicator = document.getElementById('typingIndicator');
    if (indicator) indicator.remove();
}

// Отправка текстового сообщения через WebSocket
async function sendMessage(forceImg = false) {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    
    if (!text || isWaitingResponse) return;
    
    if (!ws || ws.readyState !== WebSocket.OPEN) {
        addBotMessage('❌ WebSocket не подключён. Подождите или обновите страницу.');
        return;
    }
    
    const gender = characterData?.gender || 'female';
    
    input.value = '';
    autoResize(input);
    
    addUserMessage(text);
    showTypingIndicator();
    isWaitingResponse = true;
    document.getElementById('sendBtn').disabled = true;
    
    // Отправляем задачу через WebSocket
    ws.send(JSON.stringify({
        type: 'task',
        task_data: {
            character: characterKey,
            text_message: text,
            scene: currentNode?.scene || 'nature', scenario_prompt: currentNode?.prompt || '', scenario_branches: currentNode?.branches || [],
            generate_image: !!forceImg, image_prompt: forceImg ? (currentNode?.img || '') : '',
        }
    }));
}

// Запись голоса
async function toggleRecording() {
    const micBtn = document.getElementById('micBtn');
    
    if (!isRecording) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            let audioChunks = []; // ✅ Объявляем переменную локально

            // ✅ Добавлена стрелка => и фигурные скобки для стрелочной функции
            mediaRecorder.ondataavailable = (e) => { 
                audioChunks.push(e.data); 
            };

            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                await sendVoiceMessage(audioBlob);
                stream.getTracks().forEach(t => t.stop());
            };
            
            mediaRecorder.start();
            isRecording = true;
            micBtn.classList.add('recording');
            micBtn.innerHTML = '⏹';
            
        } catch (e) {
            alert('Не удалось получить доступ к микрофону: ' + e.message);
        }
    } else {
        mediaRecorder.stop();
        isRecording = false;
        micBtn.classList.remove('recording');
        micBtn.innerHTML = '🎤';
    }
}

// Отправка голосового сообщения через WebSocket
async function sendVoiceMessage(audioBlob) {
    if (isWaitingResponse) return;
    
    if (!ws || ws.readyState !== WebSocket.OPEN) {
        addBotMessage('❌ WebSocket не подключён.');
        return;
    }
    
    const gender = characterData?.gender || 'female';
    
    addUserMessage('🎤 Голосовое сообщение');
    showTypingIndicator();
    isWaitingResponse = true;
    document.getElementById('sendBtn').disabled = true;
    
    // Конвертируем аудио в base64
    const reader = new FileReader();
    reader.onloadend = () => {
        const audioBase64 = reader.result.split(',')[1];
        
        ws.send(JSON.stringify({
            type: 'task',
            task_data: {
                character: characterKey,
                audio_base64: audioBase64,
                text_message: '',
                scene: currentNode?.scene || 'nature', scenario_prompt: currentNode?.prompt || '', scenario_branches: currentNode?.branches || [],
                generate_image: false, image_prompt: '', nsfw: false

            }
        }));
    };
    reader.readAsDataURL(audioBlob);
}

// Утилиты
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function scrollToBottom() {
    const area = document.getElementById('messagesArea');
    area.scrollTop = area.scrollHeight;
}

function handleKeyDown(event) {
    if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
}

function autoResize(textarea) {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
}

// ============================================================================
// 🚀 ИНИЦИАЛИЗАЦИЯ
// ============================================================================

// Подключаем WebSocket
connectWebSocket();

// Загружаем данные персонажа
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadCharacter);
} else {
    loadCharacter();
}

// Ping каждые 30 секунд для поддержания соединения
setInterval(() => {
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'ping' }));
    }
}, 30000);
</script>
