    <style>
        @import url('https://fonts.googleapis.com');
        
        body { background-color: #020617; color: #f8fafc; overflow-x: hidden; font-family: 'Inter', sans-serif; margin: 0; min-height: 100vh; }

        /* Фоновая сетка */
        .grid-background {
            position: fixed; inset: -600px -300px; 
            background-image: linear-gradient(to right, rgba(168, 85, 247, 0.1) 2px, transparent 2px),
                              linear-gradient(to bottom, rgba(168, 85, 247, 0.1) 2px, transparent 2px);
            background-size: 300px 300px;
            mask-image: radial-gradient(circle at center, black 5%, transparent 90%);
            -webkit-mask-image: radial-gradient(circle at center, black 5%, transparent 90%);
            animation: grid-flow-down 20s linear infinite;
            pointer-events: none;
            z-index: 0; 
        }
        @keyframes grid-flow-down { from { transform: translateY(0); } to { transform: translateY(300px); } }

        .vignette { 
            position: fixed; 
            inset: 0; 
            background: radial-gradient(circle, transparent 20%, rgba(2, 6, 23, 0.9) 100%); 
            pointer-events: none; 
            z-index: 10; 
        }

        /* 1. УЛЬТИМАТИВНЫЙ НЕОНОВЫЙ ШИММЕР-ЛОГОТИП */
        .logo-neon { 
            font-weight: 900; 
            letter-spacing: 0.15em; 
            background: linear-gradient(90deg, #22d3ee, #c084fc, #22d3ee); 
            background-size: 200% auto; 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            animation: shimmer 4s linear infinite; 
        }

        @keyframes shimmer { 
            to { background-position: 200% center; } 
        }

        /* 2. КИНЕМАТОГРАФИЧЕСКАЯ ЛЕВИТАЦИЯ ЧЕРЕПА ЧЕРЕЗ АППАРАТНОЕ УСКОРЕНИЕ GPU */
        .skull-icon { 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            font-size: 3rem; 
            filter: drop-shadow(0 0 15px rgba(34, 211, 238, 0.5)); 
            animation: float 3s ease-in-out infinite; 
            will-change: transform, filter; /* 🚀 Включает GPU-ускорение в Windows-браузере для плавности! */
        }

        @keyframes float { 
            0%, 100% { 
                transform: translateY(0) rotate(-5deg); 
            } 
            50% { 
                transform: translateY(-8px) rotate(5deg); /* Слегка смягчили шаг взлета, чтобы не дергался */
            } 
        }

        /* 3. АДАПТИВНАЯ ОЧИСТКА ГРАНИЦ ДЛЯ ПОЛНОЭКРАННОГО СЛИТОГО ХЕДЕРА */
        header {
            width: 100%;
            max-width: 100%;
            overflow: visible; /* Позволяет drop-shadow свечению черепа красиво вылетать за рамки */
            margin: 0;
            padding-left: 1.5rem;
            padding-right: 1.5rem;
        }

        @media (min-width: 768px) {
            header {
                padding-left: 3rem;
                padding-right: 3rem;
            }
        }
    </style>
